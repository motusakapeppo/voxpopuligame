<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOX POPULI — I Tredici Gironi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden;
    font-family: 'Courier New', monospace; color:#f5f5f5; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering: pixelated; background:#000; max-width:100vw; max-height:100vh; touch-action:none; }

  #dpad { position:fixed; bottom:16px; left:16px; display:grid;
    grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,54px); gap:6px; z-index:10; }
  #dpad button { background:#0a0000; color:#e01010; border:2px solid #800808;
    font-size:20px; border-radius:8px; touch-action:none; }
  #btn-left{grid-column:1;grid-row:2}#btn-right{grid-column:3;grid-row:2}
  #btn-up{grid-column:2;grid-row:1}#btn-down{grid-column:2;grid-row:2}

  #verbs { position:fixed; bottom:16px; right:16px; display:flex; gap:10px; z-index:10; }
  #verbs button { font-family:inherit; font-size:13px; padding:14px 16px; border-radius:8px;
    border:2px solid #a80808; color:#f5f5f5; touch-action:none; }
  #btn-tendi { background:#800808; }
  #btn-spingi { background:#2a0202; }

  #prompt { position:fixed; bottom:82px; left:50%; transform:translateX(-50%);
    color:#e01010; font-size:13px; letter-spacing:1px; z-index:10; opacity:0;
    text-shadow:0 0 6px #000; transition:opacity .15s; white-space:nowrap; }
  #prompt.show { opacity:1; }

  #hud { position:fixed; top:10px; right:12px; z-index:10; font-size:12px; color:#a80808; }
  #hud button { background:none; border:1px solid #580808; color:#a80808; margin-left:8px;
    padding:2px 6px; border-radius:4px; cursor:pointer; }
  #tracklist { position:fixed; top:40px; right:12px; z-index:11; display:none;
    flex-direction:column; background:#000; border:1px solid #580808; padding:6px;
    max-height:70vh; overflow:auto; }
  #tracklist.open { display:flex; }
  #tracklist button { background:none; border:none; color:#a80808; font-family:inherit;
    text-align:left; padding:3px 6px; cursor:pointer; font-size:11px; }
  #tracklist button:disabled { color:#3a0808; cursor:default; }

  @media (hover:hover) and (pointer:fine) { #dpad, #verbs { display:none; } }

  #btn-cta { position:fixed; bottom:16px; right:16px; z-index:10; display:none;
    background:#e01010; color:#fff; border:none; padding:10px 16px; border-radius:6px;
    font-family:inherit; cursor:pointer; }
  #btn-cta.show { display:block; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="960" height="540"></canvas></div>

  <div id="dpad">
    <button id="btn-up">▲</button>
    <button id="btn-left">◀</button>
    <button id="btn-down">▼</button>
    <button id="btn-right">▶</button>
  </div>
  <div id="verbs">
    <button id="btn-tendi">TENDI</button>
    <button id="btn-spingi">SPINGI</button>
  </div>
  <div id="prompt"></div>

  <div id="hud">
    <span id="track-label">—</span>
    <button id="btn-tracklist">tracklist</button>
    <button id="btn-audio">audio: on</button>
  </div>
  <div id="tracklist"></div>
  <button id="btn-cta" type="button">Ascolta tutto · Pre-salva</button>

  <script type="module" src="src/main.js"></script>
</body>
</html>
