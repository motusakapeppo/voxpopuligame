<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { drawClimber } from '../src/figure.js';
const c = document.getElementById('c'); c.width = 1280; c.height = 720;
const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
ctx.fillStyle = '#000'; ctx.fillRect(0,0,1280,720);
const K = 6;
function cell(ox, oy, hands, ph, hang) {
  ctx.save(); ctx.translate(ox, oy); ctx.scale(K, K);
  ctx.strokeStyle = '#3a0303'; ctx.lineWidth = 1/K; ctx.strokeRect(0,0,80,64);
  const lx = hands[0][0], ly = hands[0][1], rx = hands[1][0], ry = hands[1][1];
  const bx = (lx+rx)/2, by = (ly+ry)/2 + hang;
  drawClimber(ctx, lx, ly, rx, ry, { h: 22, color:'#e01010', thickness:1, bx, by, phase:ph, detail:true });
  ctx.restore();
}
// HANG 20 (nuovo): 4 fasi del ciclo, alternate mani e gambe
cell(20, 20, [[30,16],[44,16]], 0.0, 20);
cell(500, 20, [[30,11],[44,21]], 1.6, 20);
cell(980, 20, [[30,21],[44,11]], 3.1, 20);
cell(20, 400, [[30,16],[44,16]], 4.7, 20);
cell(500, 400, [[30,13],[44,19]], 6.0, 20);
cell(980, 400, [[30,19],[44,13]], 7.5, 20);
</script></body></html>
